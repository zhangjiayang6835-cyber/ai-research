name: Update Stats Dashboard

on:
  schedule:
    - cron: "0 4 */3 * *"   # 每3天   # UTC 04:00 = 北京 12:00
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect Stats
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const fs = require("fs");

            // Collect data from GitHub
            const { data: repoData } = await github.rest.repos.get({ owner, repo });

            // Count issues and PRs. The REST list endpoints return bare arrays
            // with no `total_count` field, so the previous reads of
            // `allIssues.total_count` and `prs.total_count` were always 0 —
            // which is why the "tasks" badge read 0 on a repo with hundreds of
            // issues. Counting also cannot go through `open_issues_count`: that
            // field includes open pull requests, so `openIssues` was inflated.
            // The search API reports an exact `total_count` per query without
            // transferring a single issue body.
            const countFor = async (q) => {
              const { data } = await github.rest.search.issuesAndPullRequests({
                q: `repo:${owner}/${repo} ${q}`,
                per_page: 1,
              });
              return data.total_count;
            };
            const totalIssueCount = await countFor("is:issue");
            const totalPrCount = await countFor("is:pr");
            const openCount = await countFor("is:issue is:open");

            // Read BOUNTY_LEDGER
            let ledger = {};
            try {
              const { data: f } = await github.rest.repos.getContent({ owner, repo, path: "BOUNTY_LEDGER.json" });
              ledger = JSON.parse(Buffer.from(f.content, "base64").toString());
            } catch (e) {}

            const totalBounty = Object.values(ledger).reduce((s, u) => s + (u.total || 0), 0);
            const contributorCount = Object.keys(ledger).length;

            // Two different things were being added together before: the
            // `submissions` records (which carry a `score`) and each user's
            // `task_count` (a self-declared tally with no score attached).
            // Summing them produced a number that meant neither, and feeding
            // it into avgScore compared currency against it. Count them
            // separately and average only the scores that actually exist.
            const entries = Object.values(ledger);
            const totalSubmissions = entries.reduce(
              (s, u) => s + (Array.isArray(u.submissions) ? u.submissions.length : 0), 0
            );
            const totalTasks = entries.reduce((s, u) => s + (u.task_count || 0), 0);
            const scored = entries.flatMap((u) =>
              (Array.isArray(u.submissions) ? u.submissions : [])
                .map((x) => x.score)
                .filter((n) => typeof n === "number")
            );
            const avgScore = scored.length
              ? Math.round(scored.reduce((s, n) => s + n, 0) / scored.length)
              : 0;

            // Build stats JSON
            const stats = {
              updated: new Date().toISOString(),
              stars: repoData.stargazers_count,
              forks: repoData.forks_count,
              openIssues: openCount,
              totalIssues: totalIssueCount,
              totalPRs: totalPrCount,
              contributors: contributorCount,
              totalBounty: totalBounty,
              totalSubmissions: totalSubmissions,
              totalTasks: totalTasks,
              avgScore: avgScore
            };

            // Write to docs/stats.json
            const docsDir = "docs";
            if (!fs.existsSync(docsDir)) fs.mkdirSync(docsDir);
            fs.writeFileSync("docs/stats.json", JSON.stringify(stats, null, 2));

            // Update README badges
            let readme = "";
            if (fs.existsSync("README.md")) {
              readme = fs.readFileSync("README.md", "utf-8");
            } else {
              readme = "# AI Research Platform\n\n";
            }

            const badges = [
              `![Tasks](https://img.shields.io/badge/tasks-${stats.totalIssues}-blue)`,
              `![Contributors](https://img.shields.io/badge/contributors-${stats.contributors}-brightgreen)`,
              `![Bounty](https://img.shields.io/badge/bounty-$${stats.totalBounty}-gold)`,
              `![Submissions](https://img.shields.io/badge/submissions-${stats.totalSubmissions}-orange)`,
              `![Stars](https://img.shields.io/github/stars/${owner}/${repo})`,
              `![Last Updated](https://img.shields.io/badge/updated-${stats.updated.slice(0, 10)}-lightgrey)`,
            ].join("\n");

            // Replace or add badges section
            const badgeSection = `<!-- STATS_BADGES -->\n${badges}\n<!-- STATS_BADGES_END -->`;
            if (readme.includes("STATS_BADGES")) {
              readme = readme.replace(/<!-- STATS_BADGES -->[\s\S]*?<!-- STATS_BADGES_END -->/g, badgeSection);
            } else {
              readme = badgeSection + "\n\n" + readme;
            }

            fs.writeFileSync("README.md", readme);
            console.log("Stats dashboard updated!");

      - name: Commit Stats
        run: |
          git config user.name "AI Training Bot"
          git config user.email "bot@ai-research.github"
          git add docs/stats.json README.md
          git diff --cached --quiet || (git commit -m "stats: update dashboard" && git pull --rebase origin master && git push origin master)
