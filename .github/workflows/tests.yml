name: Test Suite

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify library modules import cleanly
        # fixes/ and src/ are the reference implementations the tests exercise.
        # Compiling them first turns a syntax error into a clear, separate signal
        # instead of a confusing collection error inside pytest.
        run: python -m compileall -q fixes src && echo "all library modules compile"

      - name: Run test suite
        run: python -m pytest -q
