name: Test Suite

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify modules under test import cleanly
        # Only the modules tests/ actually imports, not the whole of fixes/ and
        # src/. Those directories contain pre-existing files that do not parse,
        # and compiling all of them reported failures unrelated to any given
        # change. Covering the imported ones turns a real syntax error into a
        # clear signal instead of a confusing collection error inside pytest.
        run: python .github/scripts/check_test_imports.py

      - name: Run test suite
        run: python -m pytest -q
