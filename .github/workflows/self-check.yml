name: Bot Self-Check

on:
  schedule:
    - cron: "0 12 * * 0"   # 每周日 UTC 12:00
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Workflow YAML
        run: |
          echo "=== Checking workflow files ==="
          for f in .github/workflows/*.yml; do
            if [ -f "$f" ]; then
              echo -n "  $f: "
              python3 -c "import yaml; yaml.safe_load(open('$f'))" 2>&1 && echo "OK" || echo "BROKEN"
            fi
          done

      - name: Validate JSON Ledgers
        run: |
          echo "=== Checking JSON files ==="
          for f in BOUNTY_LEDGER.json TIME_LEDGER.json; do
            if [ -f "$f" ]; then
              echo -n "  $f: "
              python3 -c "import json; json.load(open('$f'))" 2>&1 && echo "VALID" || echo "CORRUPT"
            fi
          done

      - name: Check Workflow Completeness
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // The files in .github/workflows/ are the source of truth. A
            // hard-coded expected list used to live here and had drifted badly:
            // it still named workflows that had been deleted and omitted eight
            // that existed, so it could only ever report false failures.
            const dir = ".github/workflows";
            const files = fs.readdirSync(dir)
              .filter(f => /\.ya?ml$/.test(f))
              .map(f => f.replace(/\.ya?ml$/, ""))
              .sort();

            if (files.length === 0) {
              core.setFailed(`${dir} contains no workflow files — checkout is missing?`);
              return;
            }

            // Paginate: the default page size is 30, and this repo already has
            // more workflows than that. Reading only the first page silently
            // truncates the list, which then looks like "file exists on disk
            // but is not registered" and fails the check for no real reason.
            const workflows = await github.paginate(
              github.rest.actions.listRepoWorkflows,
              { owner, repo, per_page: 100 },
            );
            // GitHub keeps listing workflows whose file has been deleted from
            // the default branch, so index by filename and reconcile both ways.
            const registered = new Map();
            for (const w of workflows) {
              if (w.path.startsWith("dynamic/")) continue;
              registered.set(path.basename(w.path).replace(/\.ya?ml$/, ""), w);
            }

            // Present on disk but unknown to GitHub: the workflow will never run.
            const missing = files.filter(f => !registered.has(f));
            // Disabled in the UI, so it is registered but silent.
            const disabled = files.filter(f => registered.get(f)?.state !== "active");
            // Registered but the file is gone — harmless history, worth knowing.
            const stale = [...registered.keys()].filter(r => !files.includes(r)).sort();

            const failures = [...new Set([...missing, ...disabled])];

            let report = "## 🤖 Bot 自检报告\n\n";
            report += `检查了 \`${dir}/\` 下的 ${files.length} 个 workflow 文件。\n\n`;
            report += `| Workflow | 状态 |\n`;
            report += `|:-----|:----:|\n`;

            for (const f of files) {
              const w = registered.get(f);
              const mark = !w ? "❌ 未注册" : (w.state === "active" ? "✅" : `⚠️ ${w.state}`);
              report += `| ${f} | ${mark} |\n`;
            }

            report += `\n`;
            if (missing.length > 0) {
              report += `**文件中存在但 GitHub 未注册**: ${missing.join(", ")}\n\n`;
            }
            if (disabled.length > 0) {
              report += `**已注册但未启用**: ${disabled.join(", ")}\n\n`;
            }
            if (stale.length > 0) {
              report += `> ℹ️ 仍有登记的已删除 workflow: ${stale.join(", ")}` +
                        `（不影响运行，可忽略）\n\n`;
            }
            if (failures.length === 0) {
              report += "✅ 所有 workflow 文件均已注册并启用\n";
            }

            report += `\n> 下次自检: ${new Date(Date.now() + 7*86400000).toISOString().slice(0, 10)}\n`;
            report += `---\n*🤖 Bot Self-Check*\n`;

            // Create/update self-check issue
            const { data: existing } = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: "bot-health", per_page: 1
            });

            if (existing.length > 0) {
              await github.rest.issues.update({
                issue_number: existing[0].number, owner, repo,
                title: `🤖 Bot 健康检查 (${new Date().toISOString().slice(0, 10)})`,
                body: report
              });
            } else {
              await github.rest.issues.create({
                owner, repo,
                title: `🤖 Bot 健康检查`,
                body: report,
                labels: ["bot-health"]
              });
            }

            // Only flag real problems: a workflow file that GitHub does not
            // know about will never run, and one disabled in the UI is silent.
            // Stale registrations are reported above but must not fail the run.
            if (failures.length > 0) {
              core.setFailed("Workflow files not registered or not active: " + failures.join(", "));
              return;
            }
